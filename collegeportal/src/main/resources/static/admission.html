<!DOCTYPE html>
<html>
<head>
    <title>Admission Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Admission Application Form</h2>

<form id="admissionForm">
    <label>Student Name:</label><br>
    <input type="text" id="student_name" required><br><br>

    <label>Department:</label><br>
    <input type="text" id="department" required><br><br>

    <label>Cutoff:</label><br>
    <input type="text" id="cutoff" required><br><br>

    <label>Marksheet (upload file):</label><br>
    <input type="file" id="marksheet" required><br><br>

    <button type="submit">Submit Application</button>
</form>

<script src="js/admission.js"></script>
</body>
</html>
